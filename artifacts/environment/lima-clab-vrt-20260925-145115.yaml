minimumLimaVersion: 2.2.0

images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20260720/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:7bcf159e29ad0000bfed9c57875908c39268f5ed1257f4958fa6a9f5f60edd54

arch: aarch64
cpus: 8
memory: 16GiB
disk: 80GiB
mounts: []

containerd:
  system: false
  user: false

ssh:
  forwardAgent: false

hostResolver:
  enabled: false

portForwards:
  - guestPortRange: [1, 65535]
    ignore: true

provision:
  - mode: system
    script: |
      #!/bin/bash
      set -eux -o pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl docker.io jq
      systemctl enable --now docker
      usermod -aG docker "{{.User}}"

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      sudo docker version

message: |
  Dedicated containerlab-vrt qualification VM. Use sudo for Docker and Containerlab.
